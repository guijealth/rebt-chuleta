<?xml version="1.0" encoding="UTF-8"?>
<!-- Earth resistance with a three-terminal earth tester (Guía anexo 4, 2.2 and figure 2): current between E and H,
     voltage between S and ES, electrodes in a straight line, at least 20 m apart. Our own drawing, not to scale.
     Styled by .cheat-visual classes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 176" role="img" aria-label="Medida de la resistencia de tierra con telurómetro: electrodo, sonda S y pica H en línea, a 20 m o más">
  <!-- instrument -->
  <rect class="v-body" x="130" y="4" width="100" height="36" rx="4"/>
  <text class="v-key" x="180" y="18" text-anchor="middle">Telurómetro</text>
  <g text-anchor="middle" font-size="8.5" class="v-key">
    <text x="145" y="35">E</text><text x="163" y="35">ES</text><text x="195" y="35">S</text><text x="215" y="35">H</text>
  </g>
  <text class="v-soft" x="124" y="16" text-anchor="end" font-size="9">I: entre E y H</text>
  <text class="v-soft" x="124" y="28" text-anchor="end" font-size="9">U: entre S y ES</text>
  <text class="v-soft" x="236" y="22" font-size="9">RE = U / I</text>
  <!-- wires (they do not cross) -->
  <path class="v-line" d="M145 40V60H40V110"/>
  <path class="v-line" d="M163 40V66H48V110"/>
  <path class="v-line" d="M195 40V110"/>
  <path class="v-line" d="M215 40V60H340V110"/>
  <!-- ground and electrodes -->
  <path class="v-line" d="M8 110H352"/>
  <path class="v-rule" d="M14 116L20 110M44 116L50 110M74 116L80 110M104 116L110 110M134 116L140 110M164 116L170 110M224 116L230 110M254 116L260 110M284 116L290 110M314 116L320 110"/>
  <rect class="v-acc" x="38" y="110" width="12" height="42" rx="1"/>
  <rect class="v-acc-soft" x="192" y="110" width="6" height="18"/>
  <rect class="v-acc-soft" x="337" y="110" width="6" height="18"/>
  <!-- distances -->
  <path class="v-line" d="M50 92H190M200 92H336"/>
  <path class="v-line" d="M54 88L50 92L54 96M186 88L190 92L186 96M204 88L200 92L204 96M332 88L336 92L332 96"/>
  <g text-anchor="middle" font-size="9.5" class="v-key"><text x="120" y="88">≥ 20 m</text><text x="268" y="88">≥ 20 m</text></g>
  <path class="v-dash" d="M175 136H215"/>
  <g text-anchor="middle" font-size="8.5">
    <text x="195" y="146">S ± 2 m:</text><text x="195" y="156">mismo valor</text>
    <text x="340" y="140">H</text>
    <text x="44" y="164">RE: electrodo,</text><text x="44" y="174">desconectado</text>
  </g>
  <text class="v-soft" x="350" y="164" text-anchor="end" font-size="8.5">picas auxiliares de ≈ 30 cm, en línea recta</text>
</svg>
