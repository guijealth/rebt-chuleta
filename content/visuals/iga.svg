<?xml version="1.0" encoding="UTF-8"?>
<!-- IGA: the data that identify it (ITC-BT-17 1.2-1.3, ITC-BT-25 2.1, Guía BT-17), and how its rating sets the power
     of a home (ITC-BT-10 2.2, Guía BT-10 table C). Our own drawing: a generic two-pole device, not the marking format
     of any standard or manufacturer. Bars: length = W / 14 490 × 200. Styled by .cheat-visual classes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" role="img" aria-label="Datos de un IGA y potencia de la vivienda según su intensidad">
  <!-- generic two-pole device (phase and neutral: the single-phase example), one lever -->
  <rect class="v-body" x="10" y="6" width="70" height="98" rx="4"/>
  <circle class="v-line" cx="28" cy="16" r="4"/>
  <circle class="v-line" cx="62" cy="16" r="4"/>
  <circle class="v-line" cx="28" cy="94" r="4"/>
  <circle class="v-line" cx="62" cy="94" r="4"/>
  <rect class="v-card" x="16" y="26" width="58" height="22" rx="1.5"/>
  <path class="v-rule" d="M21 33H69M21 39H69M21 44H55"/>
  <rect class="v-card" x="22" y="56" width="46" height="26" rx="2"/>
  <rect class="v-acc" x="26" y="59" width="38" height="9" rx="1"/>
  <text class="v-soft" x="28" y="112" text-anchor="middle" font-size="8.5">L</text>
  <text class="v-soft" x="62" y="112" text-anchor="middle" font-size="8.5">N</text>
  <text class="v-soft" x="45" y="119" text-anchor="middle" font-size="7.5">ej.: monofásico</text>
  <path class="v-dash" d="M75 37H86M86 26V98"/>
  <text class="v-title" x="92" y="16">Datos de un IGA</text>
  <text class="v-key" x="92" y="32">Norma</text><text x="130" y="32">UNE-EN 60898 · industrial: 60947-2</text>
  <text class="v-key" x="92" y="46">In</text><text x="130" y="46">intensidad asignada: ≥ 25 A en vivienda</text>
  <text class="v-key" x="92" y="60">Icn</text><text x="130" y="60">poder de corte: ≥ 4 500 A y ≥ Icc del punto</text>
  <text class="v-key" x="92" y="74">Polos</text><text x="130" y="74">omnipolar: corta todos los conductores activos</text>
  <text class="v-soft" x="130" y="85" font-size="9">monofásico: L y N · trifásico: L1, L2, L3 y N</text>
  <text class="v-key" x="92" y="99">Mando</text><text x="130" y="99">manual · independiente del ICP</text>
  <path class="v-rule" d="M0 124H360"/>

  <!-- the IGA rating sets the power of the home (single phase, 230 V) -->
  <text class="v-title" x="10" y="136">Su In fija la potencia de la vivienda (230 V)</text>
  <g font-size="9.5">
    <text class="v-key" x="10" y="153">25 A</text><rect class="v-ok" x="46" y="144" width="79.4" height="12" rx="1.5"/><text x="130.4" y="153">5 750 W</text>
    <text class="v-key" x="10" y="169">32 A</text><rect class="v-ok" x="46" y="160" width="101.6" height="12" rx="1.5"/><text x="152.6" y="169">7 360 W</text>
    <text class="v-key" x="10" y="185">40 A</text><rect class="v-acc-soft" x="46" y="176" width="127.0" height="12" rx="1.5"/><text x="178.0" y="185">9 200 W</text>
    <text class="v-key" x="10" y="201">50 A</text><rect class="v-acc-soft" x="46" y="192" width="158.7" height="12" rx="1.5"/><text x="209.7" y="201">11 500 W</text>
    <text class="v-key" x="10" y="217">63 A</text><rect class="v-acc-soft" x="46" y="208" width="200.0" height="12" rx="1.5"/><text x="251.0" y="217">14 490 W</text>
  </g>
  <path class="v-line" d="M300 145V171M296 145H300M296 171H300"/>
  <text class="v-key" x="306" y="161" font-size="9.5">básica</text>
  <path class="v-line" d="M300 177V219M296 177H300M296 219H300"/>
  <text class="v-key" x="306" y="201" font-size="9.5">elevada</text>
  <text class="v-soft" x="10" y="233" font-size="9">P = 230 V × In · ej.: 230 × 25 = 5 750 W · mínimo por vivienda 5 750 W</text>
</svg>
