  <text class="v-key" x="66" y="41" text-anchor="middle" font-size="13">07</text>
  <text x="66" y="60" text-anchor="middle" font-size="8.5">450/750 V</text>
  <rect class="v-ok" x="92" y="24" width="30" height="24" rx="3"/>
