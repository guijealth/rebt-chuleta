  <text x="148" y="70" text-anchor="middle" font-size="8.5">flexible</text>
  <text class="v-soft" x="350" y="40" text-anchor="end" font-size="9">conductor aislado,</text>
  <text class="v-soft" x="350" y="51" text-anchor="end" font-size="9">sin cubierta</text>
  <text class="v-title" x="10" y="90">Cable de 0,6/1 kV</text>
  <rect class="v-ok" x="10" y="98" width="30" height="24" rx="3"/>
