<?xml version="1.0" encoding="UTF-8"?>
<!-- Cable designations read letter by letter, from the cable descriptions in the Guías (BT-14, 15, 16, 26, 28, 29, 33),
     and the conductor classes of Guía BT-26 (-U, -R, -K) and BT-33 (-F). Our own drawing; the conductor cross-sections
     are schematic. Styled by .cheat-visual classes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" role="img" aria-label="Cómo se lee la designación de un cable: H07V-K y RZ1-K (AS), y clases de conductor">
