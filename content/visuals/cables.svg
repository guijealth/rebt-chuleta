  <text x="112" y="144" text-anchor="middle" font-size="8.5">flexible</text>
  <rect class="v-card" x="138" y="98" width="52" height="24" rx="3"/>
  <text class="v-key" x="164" y="115" text-anchor="middle" font-size="13">(AS)</text>
  <text x="164" y="134" text-anchor="middle" font-size="8.5">no propaga</text>
  <text x="164" y="144" text-anchor="middle" font-size="8.5">el incendio,</text>
  <text x="164" y="154" text-anchor="middle" font-size="8.5">pocos humos</text>
  <text class="v-soft" x="350" y="114" text-anchor="end" font-size="9">sin cifra de tensión:</text>
  <text class="v-soft" x="350" y="125" text-anchor="end" font-size="9">es de 0,6/1 kV</text>
