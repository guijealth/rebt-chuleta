  <text x="66" y="144" text-anchor="middle" font-size="8.5">poliolefina</text>
  <rect class="v-acc-soft" x="92" y="98" width="40" height="24" rx="3"/>
  <text class="v-key" x="112" y="115" text-anchor="middle" font-size="13">-K</text>
