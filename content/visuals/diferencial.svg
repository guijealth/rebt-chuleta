<?xml version="1.0" encoding="UTF-8"?>
<!-- Differential (ID/AD): the data that identify it, when it trips (Guía BT-24, Guía anexo 4) and types AC/A/F/B
     (Guía BT-24 anexo I). Our own drawing: a generic device, not the marking format of any standard or manufacturer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Datos de un diferencial, umbral y tiempos de disparo, y tipos AC, A, F y B">
  <!-- generic two-module device with its test button -->
  <rect class="v-body" x="10" y="6" width="70" height="98" rx="4"/>
  <circle class="v-line" cx="28" cy="16" r="4"/>
  <circle class="v-line" cx="62" cy="16" r="4"/>
  <circle class="v-line" cx="28" cy="94" r="4"/>
  <circle class="v-line" cx="62" cy="94" r="4"/>
  <rect class="v-card" x="16" y="26" width="58" height="22" rx="1.5"/>
  <path class="v-rule" d="M21 33H69M21 39H69M21 44H55"/>
  <rect class="v-card" x="20" y="56" width="16" height="26" rx="2"/>
  <rect class="v-acc" x="23" y="59" width="10" height="9" rx="1"/>
  <rect class="v-acc-soft" x="52" y="62" width="14" height="14" rx="2"/>
  <path class="v-dash" d="M75 37H86M86 26V92M66 69H84V101H89"/>
  <text class="v-title" x="92" y="16">Datos de un diferencial</text>
  <text class="v-key" x="92" y="34">Norma</text><text x="130" y="34">UNE-EN 61008-1 (ID) · 61009-1 (AD)</text>
  <text x="130" y="45">UNE-EN 62423 (tipos F y B)</text>
  <text class="v-key" x="92" y="60">In</text><text x="130" y="60">intensidad asignada (vivienda: ≥ la del IGA)</text>
  <text class="v-key" x="92" y="75">IΔn</text><text x="130" y="75">sensibilidad: 10, 30, 100, 300, 500 mA, 1 A</text>
  <text class="v-key" x="92" y="90">Tipo</text><text x="130" y="90">AC, A, F o B (S = selectivo, retardado)</text>
  <text class="v-key" x="92" y="105">Prueba</text><text x="130" y="105">botón de prueba: púlsalo cada mes</text>
  <path class="v-rule" d="M0 116H360"/>

  <!-- when it trips: 0..1 IΔn linear (x = 20 + 210·m), then 2 and 5 IΔn -->
  <text class="v-title" x="10" y="134">Cuándo dispara</text>
  <rect class="v-ok" x="20" y="146" width="63" height="18"/>
  <text x="51.5" y="158" text-anchor="middle" font-size="9">fugas ≤ 30 %</text>
  <rect class="v-acc-soft" x="125" y="146" width="105" height="18"/>
  <text class="v-key" x="177.5" y="158" text-anchor="middle">dispara aquí</text>
  <path class="v-dash" d="M125 166V190"/>
  <text x="128" y="178" font-size="9">½ IΔn: no debe disparar</text>
  <path class="v-line" d="M20 190H232M248 190H350M20 190V194M83 190V194M125 190V194M230 190V194M285 190V194M335 190V194"/>
  <path class="v-line" d="M235 194L239 186M241 194L245 186"/>
  <g text-anchor="middle" font-size="9">
    <text x="20" y="203">0</text><text x="83" y="203">0,3</text><text x="125" y="203">0,5</text>
    <text x="230" y="203">1</text><text x="285" y="203">2</text><text x="335" y="203">5</text>
    <text class="v-key" x="230" y="216">&lt; 200 ms</text><text class="v-key" x="285" y="216">&lt; 150 ms</text><text class="v-key" x="335" y="216">&lt; 40 ms</text>
  </g>
  <text class="v-soft" x="350" y="184" text-anchor="end" font-size="9">× IΔn</text>
  <text class="v-soft" x="20" y="216" font-size="9">dispara antes de:</text>
  <text class="v-soft" x="10" y="232">Ej.: el de 30 mA dispara entre 15 y 30 mA</text>
  <path class="v-rule" d="M0 242H360"/>

  <!-- types: each one detects what the one inside detects, and more -->
  <text class="v-title" x="10" y="258">Tipos: cada uno detecta lo del anterior y más</text>
  <rect class="v-card" x="10" y="264" width="340" height="92" rx="3"/>
  <text class="v-key" x="16" y="277">B</text><text x="40" y="277">+ alterna hasta 1 000 Hz y continua alisada</text>
  <rect class="v-card" x="20" y="283" width="320" height="66" rx="3"/>
  <text class="v-key" x="26" y="296">F</text><text x="40" y="296">+ varias frecuencias (convertidores) · alisada ≤ 10 mA</text>
  <rect class="v-card" x="30" y="302" width="300" height="40" rx="3"/>
  <text class="v-key" x="36" y="315">A</text><text x="50" y="315">+ continua pulsante (alisada ≤ 6 mA)</text>
  <rect class="v-acc-soft" x="40" y="320" width="280" height="16" rx="3"/>
  <text class="v-key" x="46" y="332">AC</text><text x="64" y="332">alterna senoidal</text>
</svg>
