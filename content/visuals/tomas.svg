<?xml version="1.0" encoding="UTF-8"?>
<!-- Sockets: the three UNE 20315 bases of ITC-BT-19 2.10, as Guía BT-19 describes them ("contacto lateral de tierra",
     "espiga de contacto de tierra"), and which socket goes where (ITC-BT-19 2.10, ITC-BT-25 tabla 1, ITC-BT-52).
     Schematic, not to scale: the figures of the standard are not reproduced. Styled by .cheat-visual classes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" role="img" aria-label="Bases C2a, C3a y ESB 25-5a, y qué base va en cada sitio">
  <text class="v-title" x="10" y="14">Bases de UNE 20315 (esquema, no a escala)</text>
  <!-- C2a: side earth contacts -->
  <circle class="v-body" cx="52" cy="50" r="26"/>
  <circle class="v-card" cx="52" cy="50" r="19"/>
  <circle class="v-line" cx="43" cy="50" r="3.2"/><circle class="v-line" cx="61" cy="50" r="3.2"/>
  <rect class="v-acc" x="47" y="31" width="10" height="4" rx="1"/><rect class="v-acc" x="47" y="65" width="10" height="4" rx="1"/>
  <!-- C3a: earth pin -->
  <circle class="v-body" cx="152" cy="50" r="26"/>
  <circle class="v-card" cx="152" cy="50" r="19"/>
  <circle class="v-line" cx="143" cy="54" r="3.2"/><circle class="v-line" cx="161" cy="54" r="3.2"/>
  <circle class="v-acc" cx="152" cy="39" r="3.2"/>
  <!-- ESB 25-5a: outline only -->
  <circle class="v-body" cx="252" cy="50" r="26"/>
  <circle class="v-card" cx="252" cy="50" r="19"/>
  <text class="v-key" x="252" y="54" text-anchor="middle" font-size="11">25 A</text>
  <g text-anchor="middle" font-size="9">
    <text class="v-key" x="52" y="90">C2a · 16 A</text><text x="52" y="101">tierra: contacto lateral</text>
    <text class="v-key" x="152" y="90">C3a · 16 A</text><text x="152" y="101">tierra: espiga</text>
    <text class="v-key" x="252" y="90">ESB 25-5a · 25 A</text><text x="252" y="101">cocina y horno</text>
  </g>
  <text class="v-soft" x="350" y="40" text-anchor="end" font-size="8.5">tierra</text>
  <rect class="v-acc" x="316" y="46" width="10" height="4" rx="1"/><circle class="v-acc" cx="340" cy="48" r="3.2"/>
  <path class="v-rule" d="M0 112H360"/>

  <!-- which socket goes where -->
  <text class="v-title" x="10" y="128">Qué base va dónde</text>
  <g font-size="9.5">
    <text class="v-key" x="10" y="145">Vivienda</text><text x="96" y="145">C2a de 16 A · cocina y horno: ESB 25-5a de 25 A</text>
    <text class="v-key" x="10" y="160">Fase y neutro</text><text x="96" y="160">C3a, si hay que distinguirlos o tierra propia</text>
    <text class="v-key" x="10" y="175">No vivienda</text><text x="96" y="175">además, industriales de UNE-EN 60309</text>
    <text class="v-key" x="10" y="190">Coche eléctrico</text><text x="96" y="190">&gt; 3,7 kW: tipo 2 (UNE-EN 62196-2) · continua: combo 2</text>
    <text class="v-key" x="10" y="205">Solo reposición</text><text x="96" y="205">C1a, ESB 10-5a, ESC 10-1a</text>
  </g>
</svg>
