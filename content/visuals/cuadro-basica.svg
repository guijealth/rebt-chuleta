<!-- Home panel in the order the current flows, for one electrification grade (ITC-BT-17 1.1-1.3, ITC-BT-25 2.1 and
     2.3, PIA ratings from ITC-BT-25 table 1, IGA rating from Guía BT-10 table C). Our own drawing: generic modules
     on rails, not a wiring diagram. Styled by .cheat-visual classes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 128" role="img" aria-label="Cuadro de una vivienda de electrificación básica: ICP, IGA de 25 A, sobretensiones, un diferencial y C1 a C5">
  <text class="v-title" x="10" y="12">Electrificación básica: C1 a C5</text>
  <path class="v-rule" d="M50 51H356"/><rect class="v-dash" x="6" y="21" width="40" height="60" rx="3"/><rect class="v-body" x="10" y="26" width="32" height="50" rx="3"/><text class="v-key" x="26" y="40" text-anchor="middle" font-size="9">ICP</text><rect class="v-acc" x="22" y="52" width="8" height="10" rx="1"/><rect class="v-body" x="52" y="26" width="28" height="50" rx="3"/><text class="v-key" x="66" y="40" text-anchor="middle" font-size="9">IGA</text><rect class="v-acc" x="62" y="52" width="8" height="10" rx="1"/><text x="66" y="87" text-anchor="middle" font-size="8">25 A</text><rect class="v-body" x="86" y="26" width="28" height="50" rx="3" stroke-dasharray="3 2"/><text class="v-key" x="100" y="40" text-anchor="middle" font-size="7.5">Sobret.</text><text x="100" y="87" text-anchor="middle" font-size="8">si hace falta</text><rect class="v-body" x="120" y="26" width="40" height="50" rx="3"/><text class="v-key" x="140" y="40" text-anchor="middle" font-size="9">ID</text><rect class="v-acc" x="128" y="52" width="8" height="10" rx="1"/><rect class="v-acc-soft" x="144" y="53" width="8" height="8" rx="1"/><text x="140" y="87" text-anchor="middle" font-size="8">30 mA</text><rect class="v-body" x="166" y="26" width="26" height="50" rx="3"/><text class="v-key" x="179" y="40" text-anchor="middle" font-size="9">C1</text><rect class="v-acc" x="175" y="52" width="8" height="10" rx="1"/><text x="179" y="87" text-anchor="middle" font-size="8">10 A</text><rect class="v-body" x="194" y="26" width="26" height="50" rx="3"/><text class="v-key" x="207" y="40" text-anchor="middle" font-size="9">C2</text><rect class="v-acc" x="203" y="52" width="8" height="10" rx="1"/><text x="207" y="87" text-anchor="middle" font-size="8">16 A</text><rect class="v-body" x="222" y="26" width="26" height="50" rx="3"/><text class="v-key" x="235" y="40" text-anchor="middle" font-size="9">C3</text><rect class="v-acc" x="231" y="52" width="8" height="10" rx="1"/><text x="235" y="87" text-anchor="middle" font-size="8">25 A</text><rect class="v-body" x="250" y="26" width="26" height="50" rx="3"/><text class="v-key" x="263" y="40" text-anchor="middle" font-size="9">C4</text><rect class="v-acc" x="259" y="52" width="8" height="10" rx="1"/><text x="263" y="87" text-anchor="middle" font-size="8">20 A</text><rect class="v-body" x="278" y="26" width="26" height="50" rx="3"/><text class="v-key" x="291" y="40" text-anchor="middle" font-size="9">C5</text><rect class="v-acc" x="287" y="52" width="8" height="10" rx="1"/><text x="291" y="87" text-anchor="middle" font-size="8">16 A</text><path class="v-line" d="M120 92V96H302V92"/><text class="v-soft" x="211" y="106" text-anchor="middle" font-size="8">un diferencial para los 5 circuitos</text>
  <text class="v-soft" x="10" y="122" font-size="8.5">IGA ≥ 25 A (5 750 W) · un PIA por circuito · ICP en su compartimento precintado</text>
