     Our own drawing. Styled by .cheat-visual classes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-label="Cómo se leen los códigos IP e IK, con sus símbolos">
  <text class="v-title" x="10" y="14">Cómo se lee: IP43 (la CGP)</text>
