    <rect class="v-ok" x="122" y="22" width="60" height="26" rx="3"/><text class="v-key" x="152" y="41" font-size="15">3</text>
    <g font-size="8.5"><text x="88" y="60">sólidos &gt; 1 mm</text><text x="152" y="60">lluvia fina</text></g>
  </g>
  <text class="v-soft" x="350" y="32" text-anchor="end" font-size="9">X = cifra no ensayada (IP2X)</text>
